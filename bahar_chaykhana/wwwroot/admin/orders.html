<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заказами - Чайхана Бахар</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <header class="admin-header">
            <div class="admin-header-left">
                <h1 class="admin-logo">Бахар</h1>
                <span class="admin-subtitle">Управление заказами</span>
            </div>
            <div class="admin-header-right">
                <a href="dashboard.html" class="btn btn-outline btn-small">Назад на панель</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Дата и время</th>
                            <th>Гость</th>
                            <th>Тип</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- Заглушка: данные будут подгружаться через JavaScript -->
                        <tr>
                            <td>101</td>
                            <td>13.07.2026 14:30</td>
                            <td>Наталья</td>
                            <td>Доставка</td>
                            <td>1250 руб.</td>
                            <td>Новый</td>
                            <td><button class="btn btn-small">Изменить</button></td>
                        </tr>
                        <tr>
                            <td>102</td>
                            <td>13.07.2026 15:10</td>
                            <td>Рашид</td>
                            <td>Самовывоз</td>
                            <td>3400 руб.</td>
                            <td>Готовится</td>
                            <td><button class="btn btn-small">Изменить</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
