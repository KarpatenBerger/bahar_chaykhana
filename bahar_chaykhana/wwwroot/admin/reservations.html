<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление бронированиями - Чайхана Бахар</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <header class="admin-header">
            <div class="admin-header-left">
                <h1 class="admin-logo">Бахар</h1>
                <span class="admin-subtitle">Управление бронированиями</span>
            </div>
            <div class="admin-header-right">
                <a href="dashboard.html" class="btn btn-outline btn-small">Назад на панель</a>
            </div>
        </header>

        <main class="admin-main">
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Гость</th>
                            <th>Телефон</th>
                            <th>Гостей</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="reservations-table-body">
                        <!-- Заглушка: данные будут подгружаться через JavaScript -->
                        <tr>
                            <td>201</td>
                            <td>15.07.2026</td>
                            <td>19:00</td>
                            <td>Марина</td>
                            <td>+7 (900) 123-45-67</td>
                            <td>4</td>
                            <td>Ожидает</td>
                            <td><button class="btn btn-small">Подтвердить</button></td>
                        </tr>
                        <tr>
                            <td>202</td>
                            <td>16.07.2026</td>
                            <td>20:30</td>
                            <td>Сергей</td>
                            <td>+7 (900) 765-43-21</td>
                            <td>8</td>
                            <td>Подтверждено</td>
                            <td><button class="btn btn-small">Отменить</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
